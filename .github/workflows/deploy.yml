name: Deploy Laravel App to VPS

on:
  push:
    branches: [ main ]

jobs:
  # 1. Run CI Checks
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, intl, gd, mysql, sqlite3
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci

      # ▼▼▼ NEW STEPS ▼▼▼
      - name: Prepare .env for Wayfinder
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate Wayfinder helpers
        run: php artisan wayfinder:generate
      # ▲▲▲ END NEW STEPS ▲▲▲

      - name: Run CI Check
        run: composer ci:check

  # 2. Deploy to VPS
  deploy:
    needs: ci-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/my-app
            bash deploy.sh